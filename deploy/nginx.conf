# /etc/nginx/sites-available/esnaf-tedarik  — HTTPS (Let's Encrypt: certbot --nginx -d tedarik.alanadiniz.com)
limit_req_zone $binary_remote_addr zone=et_login:10m rate=10r/m;

server {
    listen 80;
    server_name tedarik.alanadiniz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tedarik.alanadiniz.com;

    ssl_certificate     /etc/letsencrypt/live/tedarik.alanadiniz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tedarik.alanadiniz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Katalog PDF'i (10 MB) ve görsel yükleme için
    client_max_body_size 16m;

    # Giriş ve şifre sıfırlamada ek kaba kuvvet koruması (uygulama içi sınıra ek)
    location ~ ^/api/auth/(login|forgot-password)$ {
        limit_req zone=et_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/esnaf-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/esnaf-proxy.conf;
    }
}

